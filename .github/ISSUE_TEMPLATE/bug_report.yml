name: 🐞 App problem / Problema con l'app
description: Something does not work as it should / Qualcosa non funziona come dovrebbe
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. The two things that matter most are
        the **phone models** and the **Android versions**: almost every
        problem in this app depends on how a manufacturer implemented
        Wi-Fi Direct, so without those two there is no way to reproduce
        anything.

        You can write in English or Italian — whichever you prefer.

        *Grazie per il tempo che ci stai mettendo. Le due cose che
        servono più di tutte sono **il modello dei telefoni** e **la
        versione di Android**: quasi tutti i problemi di questa app
        dipendono da come un produttore ha implementato il Wi-Fi Direct,
        quindi senza quei due dati non c'è modo di riprodurre niente.
        Scrivi in italiano o in inglese, come preferisci.*

  - type: textarea
    id: what-happens
    attributes:
      label: What happens / Cosa succede
      description: In a sentence or two, and what you expected instead. / In una o due frasi, e cosa ti aspettavi invece.
    validations:
      required: true

  - type: dropdown
    id: when
    attributes:
      label: At which point / In quale momento
      options:
        - During the one-time pairing / Durante l'accoppiamento iniziale
        - The two phones do not find each other / I due telefoni non si trovano
        - They connect but no picture arrives / Si collegano ma l'immagine non arriva
        - Picture arrives but is choppy or distorted / L'immagine arriva ma è scattosa o distorta
        - Touches do not work or land in the wrong place / I tocchi non funzionano o finiscono nel punto sbagliato
        - The minute count / Il conteggio dei minuti
        - The subscription / L'abbonamento
        - Other / Altro
    validations:
      required: true

  - type: input
    id: sharing-phone
    attributes:
      label: SHARING phone / Telefono che CONDIVIDE
      description: Model and Android version / Modello e versione di Android
      placeholder: "e.g. realme 14 Pro+ 5G, Android 16"
    validations:
      required: true

  - type: input
    id: watching-phone
    attributes:
      label: WATCHING phone / Telefono che GUARDA
      description: Model and Android version / Modello e versione di Android
      placeholder: "e.g. Huawei P9, Android 7"
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: ScreenSpan version / Versione di ScreenSpan
      description: At the bottom of the app's main screen. / La trovi in fondo alla schermata principale dell'app.
      placeholder: "e.g. 1.5"

  - type: textarea
    id: steps
    attributes:
      label: How to reproduce / Come si riproduce
      description: The steps in order, starting from opening the app. / I passaggi nell'ordine, dall'apertura dell'app.
      placeholder: |
        1. I open the app on phone A and pick "Source"
        2. ...

  - type: textarea
    id: anything-else
    attributes:
      label: Anything else / Altro
      description: Photos or a short video help more than any description. Drag them here. / Foto o un breve video aiutano più di qualunque descrizione. Trascinali qui.
