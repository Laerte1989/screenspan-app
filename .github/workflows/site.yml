name: Site checks

# Runs on every change to the pages. It builds nothing and deploys
# nothing - GitHub Pages publishes on its own - but it stops a broken
# link, a page with no viewport, or a string that was never meant to be
# public from going online.
on:
  push:
    branches: [main]
    paths: ["*.html", "*.md", "*.jpg", "LICENSE", "tools/**", ".github/workflows/site.yml"]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Links, languages, meta tags, secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/check-site.py
